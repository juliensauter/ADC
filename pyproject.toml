[project]
name = "adc"
version = "0.1.0"
description = "Adaptively Distilled ControlNet — liver laparoscopic image synthesis"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "pytorch-lightning==2.6.1",  # pinned: 2.6.2 + 2.6.3 had a supply-chain compromise (May 2026)
    "einops",
    "omegaconf",
    "albumentations",
    "transformers==5.9.0",
    "safetensors",
    "open-clip-torch",
    "kornia",
    "scipy",
    "opencv-python",
    "scikit-learn",
    "huggingface-hub",
    "torchmetrics[image]==1.9.0",
    "lpips",
    "dreamsim==0.2.1",
]
